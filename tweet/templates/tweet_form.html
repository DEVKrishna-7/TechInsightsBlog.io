{% extends "layout.html" %}

{% block title %}
    {% if form.instance.pk %}Edit Tweet{% else %}Create Tweet{% endif %} - BlogHQ
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <h2 class="h5 mb-0">{% if form.instance.pk %}Edit Tweet{% else %}Create Tweet{% endif %}</h2>
                </div>
                <div class="card-body">
                    <form action="" method="post" enctype="multipart/form-data" class="g-3">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex gap-2 mt-3">
                            <button class="btn btn-primary" type="submit">Save</button>
                            <a class="btn btn-secondary" href="{% url 'tweet_list' %}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
