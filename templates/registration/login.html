{% extends "layout.html" %}

{% block title %}Login - BlogHQ{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <h2 class="h5 mb-0">Login to BlogHQ</h2>
                </div>
                <div class="card-body">
                    <form method="post" class="g-3">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-primary mt-3" type="submit">Login</button>
                    </form>
                    <p class="mt-3 mb-0">Don't have an account? <a href="{% url 'register' %}">Register here</a>.</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
